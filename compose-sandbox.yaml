services:
  postgres:
    container_name: "sandbox-db"
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=sandbox-merchant-checker'
      - 'POSTGRES_PASSWORD=sandbox-bobby'
      - 'POSTGRES_USER=sandbox-bobby'
    ports:
      - '5433:5433'
  redis:
    container_name: "sandbox-redis"
    image: 'redis:latest'
    ports:
      - '6379'
