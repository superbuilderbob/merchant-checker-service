services:
  postgres:
    container_name: "dev-db"
    image: 'postgres:18-alpine'
    environment:
      - 'POSTGRES_DB=dev-merchant-checker'
      - 'POSTGRES_PASSWORD=dev-bobby'
      - 'POSTGRES_USER=dev-bobby'
    ports:
      - '5432:5432'
    networks:
      - backend
  redis:
    container_name: "dev-redis"
    build:
      context: .
      dockerfile: dev-redis.Dockerfile
    ports:
      - '6379:6379'
    networks:
      - backend

networks:
  backend:
    driver: bridge